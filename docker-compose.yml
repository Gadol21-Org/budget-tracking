# Local MySQL for `cargo run`; matches MYSQL_URL in .env.example.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: budget
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbudget"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
