[package]
name = "budget-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
oracle-nosql-rust-sdk = "0.1.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql"] }
async-trait = "0.1"
jsonwebtoken = "9"
base64 = "0.22"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"

# The SDK requires OpenSSL. Windows has none, so build it from source there (feature
# unification applies "vendored" to the SDK's copy); other platforms use the system one.
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
